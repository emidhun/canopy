# Documentation site — build website/ and publish it to GitHub Pages.
#
# The site has no dependencies: content is Markdown and the generator is plain
# Node, so there is nothing to install and no lockfile to keep in step.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never cancel a deploy in flight; a queued run supersedes an older one
concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site
        run: node scripts/build.mjs
        working-directory: website
      # the build reports missing screenshots instead of failing, so assert here
      # that every page and every image made it into the output
      - name: Check the output
        working-directory: website
        run: |
          pages=$(ls site/*.html | wc -l | tr -d ' ')
          shots=$(ls site/assets/screens/light/*.png site/assets/screens/dark/*.png | wc -l | tr -d ' ')
          echo "built $pages pages, $shots screenshots"
          test "$pages" -ge 31
          test "$shots" -ge 80
      - name: Disable Jekyll
        run: touch website/site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: website/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
