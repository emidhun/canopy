# Interactive Claude: mention @claude in any issue/PR comment and it responds
# (answer questions, review fork PRs, make small fixes). Runs in base-repo
# context, so it works on fork PRs too — but only maintainers/contributors
# should summon it; the job is gated to users with write access.
#
# Requires the ANTHROPIC_API_KEY repo secret.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: >
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
