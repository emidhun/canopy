# Release — build installers on a version tag (v0.4.0 → draft GitHub release).
# macOS: .app + .dmg (arm64). Linux: .deb / .AppImage / .rpm (untested port —
# artifacts are published so early adopters can try them).
name: release

on:
  push:
    tags: ["v*"]

# the default GITHUB_TOKEN is read-only on new repos; tauri-action needs to
# create the release and upload assets
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: ubuntu-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system deps (linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential \
            curl wget file libxdo-dev libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Canopy ${{ github.ref_name }}"
          releaseDraft: true
          args: ${{ matrix.args }}
